[package]
name = "gemz"
version = "0.1.0"
edition = "2024"

[lib]

[[bin]]
name = "gemz"
path = "src/gemz.rs"

[[bin]]
name = "ungemz"
path = "src/ungemz.rs"

[dependencies]
tokenizers = "0.23"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
anyhow = "1.0"
bitvec = "1.1"
clap = { version = "4.6", features = ["derive"] }